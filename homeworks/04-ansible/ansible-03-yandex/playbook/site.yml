---
- name: Install Clickhouse
  hosts: clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Get clickhouse distrib
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/deb/pool/main/c/{{ item.name }}/{{ item.name }}_{{ clickhouse_version }}_{{ item.arch }}.deb"
        dest: "./{{ item.name }}_{{ clickhouse_version }}_{{ item.arch }}.deb"
        mode: "0644"
      loop: "{{ clickhouse_packages }}"
      tags: [clickhouse, download]
    - name: Install clickhouse packages
      become: true
      ansible.builtin.apt:
        deb: "./{{ item.name }}_{{ clickhouse_version }}_{{ item.arch }}.deb"
      loop: "{{ clickhouse_packages }}"
      notify: Start clickhouse service
      tags: [clickhouse, install]
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers
      tags: [clickhouse, install]
    - name: Wait for clickhouse-server to be ready
      ansible.builtin.wait_for:
        port: 9000
        timeout: 60
      tags: [clickhouse]
    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0
      tags: [clickhouse]


- name: Install Vector
  hosts: vector
  handlers:
    - name: Restart vector service
      become: true
      ansible.builtin.systemd_service:
        name: vector
        state: restarted
        daemon_reload: true
  tasks:
    - name: Get vector distrib
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "./vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        mode: "0644"
      tags: [vector, download]
    - name: Create vector install directory
      become: true
      ansible.builtin.file:
        path: "{{ vector_install_dir }}"
        state: directory
        mode: "0755"
      tags: [vector, install]
    - name: Unpack vector distrib
      become: true
      ansible.builtin.unarchive:
        src: "./vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        extra_opts: [--strip-components=2]
        creates: "{{ vector_install_dir }}/bin/vector"
      tags: [vector, install]
    - name: Install vector binary
      become: true
      ansible.builtin.file:
        src: "{{ vector_install_dir }}/bin/vector"
        dest: /usr/bin/vector
        state: link
      notify: Restart vector service
      tags: [vector, install]
    - name: Create vector group
      become: true
      ansible.builtin.group:
        name: vector
        system: true
      tags: [vector, install]
    - name: Create vector user
      become: true
      ansible.builtin.user:
        name: vector
        group: vector
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      tags: [vector, install]
    - name: Create vector config directory
      become: true
      ansible.builtin.file:
        path: "{{ vector_config_dir }}"
        state: directory
        mode: "0755"
      tags: [vector, config]
    - name: Create vector data directory
      become: true
      ansible.builtin.file:
        path: "{{ vector_data_dir }}"
        state: directory
        owner: vector
        group: vector
        mode: "0750"
      tags: [vector, install]
    - name: Deploy vector config
      become: true
      ansible.builtin.template:
        src: vector.yaml.j2
        dest: "{{ vector_config_dir }}/vector.yaml"
        mode: "0644"
        validate: /usr/bin/vector validate --no-environment --config-yaml %s
      notify: Restart vector service
      tags: [vector, config]
    - name: Install vector systemd unit
      become: true
      ansible.builtin.copy:
        src: "{{ vector_install_dir }}/etc/systemd/vector.service"
        dest: /etc/systemd/system/vector.service
        remote_src: true
        mode: "0644"
      notify: Restart vector service
      tags: [vector, install]
    - name: Start vector service
      become: true
      ansible.builtin.systemd_service:
        name: vector
        state: started
        enabled: true
        daemon_reload: true
      tags: [vector]

- name: Install nginx
  hosts: lighthouse
  handlers:
    - name: Reload nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: reloaded
  tasks:
    - name: Install nginx package
      become: true
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [nginx, install]
    - name: Disable nginx default site
      become: true
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx
      tags: [nginx, config]
    - name: Start nginx service
      become: true
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: [nginx]

- name: Install LightHouse
  hosts: lighthouse
  handlers:
    - name: Reload nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: reloaded
  tasks:
    - name: Get lighthouse distrib
      ansible.builtin.get_url:
        url: "https://github.com/VKCOM/lighthouse/archive/{{ lighthouse_commit }}.tar.gz"
        dest: "./lighthouse-{{ lighthouse_commit }}.tar.gz"
        mode: "0644"
      tags: [lighthouse, download]
    - name: Create lighthouse directory
      become: true
      ansible.builtin.file:
        path: "{{ lighthouse_dir }}"
        state: directory
        mode: "0755"
      tags: [lighthouse, install]
    - name: Unpack lighthouse distrib
      become: true
      ansible.builtin.unarchive:
        src: "./lighthouse-{{ lighthouse_commit }}.tar.gz"
        dest: "{{ lighthouse_dir }}"
        remote_src: true
        extra_opts: [--strip-components=1]
        creates: "{{ lighthouse_dir }}/index.html"
      tags: [lighthouse, install]
    - name: Deploy nginx config for lighthouse
      become: true
      ansible.builtin.template:
        src: lighthouse.conf.j2
        dest: /etc/nginx/conf.d/lighthouse.conf
        mode: "0644"
      notify: Reload nginx
      tags: [lighthouse, config]
